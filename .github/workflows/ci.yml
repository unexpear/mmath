# Certification matrix (ADR-015): MSVC Debug+Release on Windows,
# GCC Debug+Release and Clang Debug+Release on Linux, plus one
# ASan+UBSan job. Runner images are pinned; compiler versions print in the
# log and land in the numerics.json artifact per job.

name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            config: Release
          - os: windows-2022
            config: Debug
          - os: ubuntu-24.04
            config: Release
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-24.04
            config: Debug
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-24.04
            config: Release
            cc: clang-18
            cxx: clang++-18
          - os: ubuntu-24.04
            config: Debug
            cc: clang-18
            cxx: clang++-18
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 18 (Linux/Clang jobs)
        if: matrix.cxx == 'clang++-18'
        run: sudo apt-get update && sudo apt-get install -y clang-18
      # MSVC's cl.exe is not on PATH in a plain bash step on windows-2022
      # (no developer environment), and cl has no --version flag: the first
      # hosted run failed here with exit 127 before building. Windows prints
      # the Visual Studio version via vswhere instead; the exact MSVC version
      # is recorded by CMake's configure step and in numerics.json.
      - name: Toolchain versions
        run: |
          cmake --version
          if [ -n "${{ matrix.cxx }}" ]; then
            ${{ matrix.cxx }} --version | head -n 3
          else
            "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
              -latest -property catalog_productDisplayVersion
          fi
        shell: bash
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          ${{ matrix.cc && format('-DCMAKE_C_COMPILER={0} -DCMAKE_CXX_COMPILER={1}', matrix.cc, matrix.cxx) || '' }}
        shell: bash
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
        shell: bash
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
        shell: bash
      - name: Upload numerics record
        uses: actions/upload-artifact@v4
        with:
          name: numerics-${{ matrix.os }}-${{ matrix.config }}-${{ matrix.cxx || 'msvc' }}
          path: build/numerics.json

  # Any sanitizer finding must fail this job. UBSan's default is to print a
  # report and continue with exit code 0, so findings are made fatal twice:
  # -fno-sanitize-recover=all at compile time (CMakeLists.txt) and
  # halt_on_error=1 at run time. The examples run here too, not only ctest,
  # and their output is scanned for sanitizer reports as a third gate.
  sanitize:
    runs-on: ubuntu-24.04
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan+UBSan, GCC 13)
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          -DMMATHEN_SANITIZE=ON
        shell: bash
      - name: Build
        run: cmake --build build-san
        shell: bash
      - name: Test
        run: ctest --test-dir build-san --output-on-failure
        shell: bash
      - name: Run examples under sanitizers
        run: |
          set -euo pipefail
          # Expected set: the foreach(example ...) list in CMakeLists.txt, so a
          # new example cannot silently skip this gate.
          expected=$(sed -n '/foreach(example/,/)/p' CMakeLists.txt |
                     sed 's/foreach(example//; s/).*//' | tr -s ' ' '\n' |
                     grep -v '^$' | sort)
          count=$(printf '%s\n' "$expected" | wc -l)
          echo "expecting $count examples"
          work=$(mktemp -d)
          for name in $expected; do
            exe="$GITHUB_WORKSPACE/build-san/$name"
            test -x "$exe" || { echo "::error::missing example $name"; exit 1; }
            echo "::group::$name"
            (cd "$work" && "$exe") 2>&1 | tee "$work/$name.log"
            echo "::endgroup::"
          done
          if grep -lE "runtime error|AddressSanitizer|LeakSanitizer" "$work"/*.log; then
            echo "::error::sanitizer report in example output"
            exit 1
          fi
          echo "all $count examples exited 0 with no sanitizer reports"
        shell: bash
